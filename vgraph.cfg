# Dependency directions checked by `nimble checkVGraph`.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (fibonacci ->
# fibonacci.nim) or a directory (types -> types/*.nim). Modules under no listed
# layer are unconstrained: the umbrella module re-exports everything.
[layers]
types
visitor
kernel_concept
kernels
graph
visualize
algorithms
c_api

